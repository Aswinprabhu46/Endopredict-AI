name: EndoPredict Load Test & Security Review

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ── Job 1: Concurrent Load Test (100 Users × 60s) ─────────────────────────
  load-test:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Node Dependencies
        run: npm install

      - name: 🚀 Start Vite Dev Server
        run: |
          npm run dev &
          npx wait-on http://localhost:5173 --timeout 30000

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python Dependencies
        run: pip install -r requirements.txt

      - name: 🔥 Run 100-User Concurrent Load Test (60s)
        env:
          LOAD_TEST_URL: "http://localhost:5173"
          VIRTUAL_USERS: "100"
          DURATION_SECS: "60"
        run: python tests/load_test.py

      - name: 📊 Upload Load Test Excel Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EndoPredict-Load-Test-Report
          path: EndoPredict_Load_Test_Report.xlsx
          retention-days: 30

  # ── Job 2: Static Security Code Review (SAST) ─────────────────────────────
  security-review:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python Dependencies
        run: pip install openpyxl

      - name: 🛡️ Run Static Security Code Review
        run: python tests/security_review.py

      - name: 📊 Upload Security Review Excel Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EndoPredict-Security-Review-Report
          path: EndoPredict_Security_Review_Report.xlsx
          retention-days: 30

      - name: 📝 Upload Executive Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vulnerability-Test-Results
          path: Vulnerability Test Results/
          retention-days: 30
