name: EndoPredict Selenium Automated Tests & Excel Report

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  selenium-test-suite:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm install

      - name: 🚀 Start EndoPredict Vite Web Server
        run: |
          npm run dev &
          npx wait-on http://localhost:5173 --timeout 30000

      - name: 🐍 Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager openpyxl

      - name: 🌐 Install Google Chrome & ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -fy

      - name: 🧪 Execute 124 Live Selenium Test Cases
        env:
          HEADLESS: "true"
          TEST_BASE_URL: "http://localhost:5173/"
        run: |
          python tests/run_live_tests.py

      - name: 📊 Upload Excel Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EndoPredict-Selenium-Test-Report
          path: EndoPredict_Selenium_Test_Report.xlsx
          retention-days: 30
